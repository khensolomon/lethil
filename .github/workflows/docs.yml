# ===========================================================================
# Docs build & cross-repo deploy
#
# The Jekyll source for the site lives in this repository under docs/. This
# workflow builds it and pushes the generated static site to the SEPARATE
# repository `khensolomon/khensolomon.github.io`, which GitHub serves at
#   https://khensolomon.github.io/
#
# WHY A DEPLOY KEY (and not the built-in GITHUB_TOKEN):
#   The automatic GITHUB_TOKEN is scoped to THIS repo only — it cannot push to
#   another repository. To write into khensolomon.github.io we authenticate
#   with an SSH deploy key: the PUBLIC half is added to khensolomon.github.io
#   (with write access), the PRIVATE half is stored here as a secret. See the
#   one-time setup in README.md.
#
# TRIGGER:
#   Runs on push to main, but only actually deploys when the commit message
#   starts with "docs update:" — e.g.
#       git commit -m "docs update: rewrite the server guide"
#   Any other message pushes to main without touching the live site, so
#   ordinary commits and local work stay cheap. A manual run is also available
#   from the Actions tab (workflow_dispatch), which always deploys.
# ===========================================================================
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch: {}          # manual deploy from the Actions tab, no commit needed

# Only one deploy at a time; a newer one supersedes an in-flight one.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    # Gate: deploy only on "docs update:" commits (manual dispatch always runs).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'docs update:')
    runs-on: ubuntu-latest
    # Cap the whole job. If the deploy key is bad, `ssh-add` can HANG waiting for
    # a passphrase prompt that never comes — this makes it fail in minutes rather
    # than sitting for the default 6-hour limit.
    timeout-minutes: 8

    steps:
      - name: Checkout lethil (docs source)
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # cache bundler downloads; keyed on docs/Gemfile.lock when present
          bundler-cache: true
          working-directory: docs

      - name: Build the site
        # Source is the docs/ folder; output goes to ./_site at the repo root.
        # NOTE: bundler installs gems into docs/vendor/bundle (via the caching
        # above), so _config.yml MUST exclude vendor/ — otherwise Jekyll tries
        # to render the gems' own Liquid fixtures as pages and the build fails.
        # --trace prints a full backtrace if anything goes wrong.
        run: |
          cd docs
          bundle exec jekyll build --source . --destination "$GITHUB_WORKSPACE/_site" --trace
        env:
          JEKYLL_ENV: production

      - name: Add LICENSE + README to the published root
        # These two live in docs/ but are excluded from the Jekyll build (they're
        # not page content). Copy them into _site/ so they land at the ROOT of
        # khensolomon.github.io as plain files, verbatim. `-f` and the existence
        # guard keep the build from failing if either is ever absent.
        run: |
          for f in LICENSE README.md; do
            if [ -f "docs/$f" ]; then
              cp -f "docs/$f" "_site/$f"
              echo "copied docs/$f -> _site/$f"
            else
              echo "note: docs/$f not present, skipping"
            fi
          done

      - name: Deploy to khensolomon.github.io
        # peaceiris/actions-gh-pages pushes a built directory to another repo.
        # Default here: an SSH deploy key (repo-scoped, most locked-down).
        #
        # If the SSH path ever gives trouble (e.g. ssh-add hangs), swap to a
        # Personal Access Token — it deploys over HTTPS and never touches
        # ssh-add, so it can't hang that way. To switch: comment out `deploy_key`
        # below and use `personal_token: ${{ secrets.PAGES_PAT }}` instead,
        # where PAGES_PAT is a fine-grained PAT with Contents: read/write on
        # khensolomon.github.io. Everything else stays the same.
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          # personal_token: ${{ secrets.PAGES_PAT }}   # ← HTTPS alternative
          external_repository: khensolomon/khensolomon.github.io
          publish_branch: main
          publish_dir: ./_site
          # We push ALREADY-BUILT HTML. This action writes a .nojekyll file by
          # default, which tells GitHub Pages to serve the files as-is instead
          # of trying to run Jekyll on them again (which would break _-prefixed
          # paths and re-processing). Left at the default (true) on purpose.
          enable_jekyll: false
          # A user site serves the repo root, so publish the whole _site as-is.
          # keep_files: false (default) — the target mirrors the built output,
          # so files deleted from the source are removed from the live site too.
          # CNAME: uncomment and set if a custom domain is ever added.
          # cname: example.com
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
