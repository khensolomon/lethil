name: docs

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'docs update:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lethil (docs source)
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Build the site
        run: |
          cd docs
          bundle exec jekyll build --source . --destination "$GITHUB_WORKSPACE/_site"
        env:
          JEKYLL_ENV: production

      - name: Deploy to khensolomon.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: khensolomon/khensolomon.github.io
          publish_branch: master
          publish_dir: ./_site
          enable_jekyll: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
