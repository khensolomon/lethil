# The tool set. One source for both the sidebar rail (icons, every page) and
# the tab strip at the top of each tool page (labels, tool pages only), so the
# two can never list different things.
#
# `icon` is inner SVG markup rendered into a 24x24 viewBox with a 1.6 stroke.

- key: directory
  label: "Directory"
  url: "/directory/"
  blurb: "Every page, filtered by category and tag"
  icon: >-
    <rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>

- key: tags
  label: "Tags"
  url: "/tags/"
  blurb: "Narrow the library by combining tags"
  icon: >-
    <path d="M4 12V5.5A1.5 1.5 0 0 1 5.5 4H12l8 8-6.5 6.5z"/><circle cx="8" cy="8" r="1.2"/>

- key: graph
  label: "Graph"
  url: "/graph/"
  blurb: "How pages link to one another"
  icon: >-
    <circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="9" r="2.2"/><circle cx="11" cy="18" r="2.2"/><path d="M8 8l8 .6M7 9.2 10 15.8M16.6 11l-4 5.4"/>

- key: todo
  label: "Todo"
  url: "/todo/"
  blurb: "What's next, in progress, and shipped"
  icon: >-
    <path d="M4 6.5 6 8.5 9.5 5"/><path d="M4 17.5 6 19.5 9.5 16"/><path d="M13 7h7M13 18h7"/>

- key: bookmarks
  label: "Bookmarks"
  url: "/bookmarks/"
  blurb: "Pages saved on this device"
  icon: >-
    <path d="M6 4h12v16l-6-4.5L6 20z"/>

- key: settings
  label: "Settings"
  url: "/settings/"
  blurb: "Values filled into code blocks"
  icon: >-
    <circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>
