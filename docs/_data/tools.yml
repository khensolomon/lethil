# The tool set. One source for both the sidebar rail (icons, every page) and
# the tab strip at the top of each tool page (labels, tool pages only), so the
# two can never list different things.
#
# `icon` is inner SVG markup rendered into a 24x24 viewBox with a 1.6 stroke.

- key: directory
  label: "Directory"
  url: "/directory/"
  blurb: "Every page, filtered by category and tag"
  icon: >-
    <rect x="3.5" y="4" width="7.5" height="7.5" rx="1.2"/><rect x="3.5" y="13" width="7.5" height="7"  rx="1.2"/><path d="M14.5 6h6M14.5 10h6M14.5 15h6M14.5 19h6"/>

- key: tags
  label: "Tags"
  url: "/tags/"
  blurb: "Narrow the library by combining tags"
  icon: >-
    <path d="M4 12V5.5A1.5 1.5 0 0 1 5.5 4H12l8 8-6.5 6.5z"/><circle cx="8" cy="8" r="1.2"/>

- key: graph
  label: "Graph"
  url: "/graph/"
  blurb: "How pages link to one another"
  icon: >-
    <path d="M12 8.6v3.4M9.2 17.2 11 14.2M14.8 17.2 13 14.2"/><circle cx="12" cy="6" r="2.6"/><circle cx="7" cy="19" r="2.4"/><circle cx="17" cy="19" r="2.4"/>

- key: todo
  label: "Todo"
  url: "/todo/"
  blurb: "What's next, in progress, and shipped"
  icon: >-
    <path d="M9 4.5h6a1 1 0 0 1 1 1V7H8V5.5a1 1 0 0 1 1-1z"/><path d="M16 6h2a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h2"/><path d="M8.5 12.2l1.7 1.7 3.6-3.6"/><path d="M8.5 17h7"/>

- key: review
  label: "Review"
  url: "/review/"
  blurb: "Page notes and site findings"
  icon: >-
    <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H15l5 5v9.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M14.5 4v5.5H20"/><path d="M8 13.5l2 2 4-4"/>

- key: bookmarks
  label: "Bookmarks"
  url: "/bookmarks/"
  blurb: "Pages saved on this device"
  icon: >-
    <path d="M6.5 3.5h11a1 1 0 0 1 1 1V20a.5.5 0 0 1-.8.4L12 16l-5.7 4.4a.5.5 0 0 1-.8-.4V4.5a1 1 0 0 1 1-1z"/>

- key: settings
  label: "Settings"
  url: "/settings/"
  blurb: "Values filled into code blocks"
  icon: >-
    <path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h9M17 17h3"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="15" cy="17" r="2"/>
