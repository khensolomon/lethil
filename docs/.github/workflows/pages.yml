# ---------------------------------------------------------------------------
# GitHub Pages deploy — gated on commit message.
#
# Only commits whose message starts with "deploy:" reach production:
#     git commit -m "deploy: header + sidebar rework"
# Everything else pushes to main without touching the live site, so local
# work (`bundle exec jekyll serve`) and WIP commits stay cheap.
#
# One-time repo setting: Settings → Pages → Source → "GitHub Actions".
# ---------------------------------------------------------------------------
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}          # manual deploy from the Actions tab, no commit needed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true       # a newer deploy supersedes an in-flight one

jobs:
  build:
    # Gate: commit message must start with "deploy:" (manual dispatch always runs).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'deploy:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll (github-pages gem parity)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
