{%- if include.minimal -%}
<footer class="portfoot inset">
  <span class="mono">{{ site.title }} &copy; {{ 'now' | date: "%Y" }}</span>
  <span class="portfoot__updated mono muted" data-site-updated hidden></span>
</footer>
{%- else -%}
<footer class="docfoot inset">
  <div class="docfoot__inner">
    <span class="mono muted docfoot__built">
      {{ site.title }} · built with
      <a class="docfoot__jekyll" href="https://jekyllrb.com" rel="noopener" target="_blank" aria-label="Jekyll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 3h6"/>
          <path d="M10 3v6.5L5.6 18.2A2 2 0 0 0 7.4 21h9.2a2 2 0 0 0 1.8-2.8L14 9.5V3"/>
          <path d="M7.7 14h8.6"/>
        </svg>
      </a>
    </span>
    <span class="mono muted">© {{ 'now' | date: "%Y" }}</span>
  </div>
</footer>
{%- endif -%}
